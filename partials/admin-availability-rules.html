<!-- Admin Availability Rules Section -->
<style>
  #adminAvailabilityRulesList .rule-card {
    width: 100%;
    background-color: #dbeafe !important;
    border: 2px solid #3b82f6 !important;
    border-radius: 0.5rem;
    color: #111827 !important;
    padding: 1rem;
    margin-bottom: 0.75rem;
  }

  #adminAvailabilityRulesList .rule-card:hover {
    border-color: #2563eb !important;
  }

  #adminAvailabilityRulesList .rule-card.inactive-rule {
    background-color: #f1f5f9 !important;
    border-color: #94a3b8 !important;
  }

  #adminAvailabilityRulesList .rule-card.inactive-rule:hover {
    border-color: #64748b !important;
  }

  #adminAvailabilityRulesList .rule-card input,
  #adminAvailabilityRulesList .rule-card select {
    background: #ffffff !important;
    color: #111827 !important;
  }

  #adminAvailabilityRulesList .rule-card label {
    color: #111827 !important;
  }

  #section-availability-rules .btn-outline-red {
    background: transparent !important;
    border: 1px solid var(--danger) !important;
    color: var(--danger) !important;
  }

  #section-availability-rules .btn-outline-red:hover {
    background: rgba(220, 38, 38, 0.08) !important;
    border-color: var(--danger) !important;
    color: var(--danger) !important;
  }

  .rule-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    align-items: end;
  }

  @media (max-width: 639px) {
    .rule-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<section id="section-availability-rules" class="section-content hidden">
  <div class="bg-white rounded-2xl border shadow-sm p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">Availability Rules</h2>
      
      <div class="flex gap-2">
        <button id="addAvailabilityRuleBtn" class="btn btn-primary" type="button">
          Add Rule
        </button>
        <button id="availabilityRulesRefreshBtn" class="btn btn-primary-light" type="button" aria-label="Refresh availability rules" title="Refresh">
          <svg class="sm:hidden" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 8c0-3.3-2.7-6-6-6S2 4.7 2 8s2.7 6 6 6c1.8 0 3.4-.8 4.5-2M14 3v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="hidden sm:inline">Refresh</span>
        </button>
      </div>
    </div>

    <div id="availabilityRulesMsg" class="text-sm mb-3"></div>
    <div id="adminAvailabilityRulesList"></div>
  </div>
</section>

<script>
(function() {
  const DAYS_OF_WEEK = [
    { value: 0, name: 'Sunday' },
    { value: 1, name: 'Monday' },
    { value: 2, name: 'Tuesday' },
    { value: 3, name: 'Wednesday' },
    { value: 4, name: 'Thursday' },
    { value: 5, name: 'Friday' },
    { value: 6, name: 'Saturday' }
  ];

  let allAvailabilityRules = [];
  let allResources = [];
  let allServiceTypes = [];
  let allServiceCategories = [];
  let allServices = [];
  let isAddingNew = false;
  let rulesLoaded = false;

  function setRulesMsg(text, cls) {
    const el = document.getElementById('availabilityRulesMsg');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'text-sm mb-3 ' + (cls || '');
  }

  function safeText(value) {
    return (value === null || value === undefined) ? '' : String(value);
  }

  function escapeHtml(str) {
    return safeText(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatTimeForDb(timeStr) {
    if (!timeStr) return null;
    const parts = timeStr.split(':');
    if (parts.length === 2) {
      return `${parts[0]}:${parts[1]}:00`;
    }
    return timeStr;
  }

  function getResourceName(resourceId) {
    const resource = allResources.find(r => r.id === resourceId);
    return resource ? resource.name : 'Unknown Resource';
  }

  function getTypeName(typeId) {
    const type = allServiceTypes.find(t => t.id === typeId);
    return type ? type.name : 'Unknown Type';
  }

  function getCategoryName(categoryId) {
    const category = allServiceCategories.find(c => c.id === categoryId);
    return category ? category.name : 'Unknown Category';
  }

  function getServiceName(serviceId) {
    const service = allServices.find(s => s.id === serviceId);
    return service ? service.name : 'Unknown Service';
  }

  function getDayName(dayOfWeek) {
    const day = DAYS_OF_WEEK.find(d => d.value === dayOfWeek);
    return day ? day.name : 'Unknown Day';
  }

  function renderRuleCard(rule, isNew = false) {
    const ruleId = isNew ? 'new' : rule.id;
    const inputCls = 'w-full bg-white text-gray-900 border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500';
    const labelCls = 'text-xs font-medium text-gray-700 mb-1 block';
    
    const resourceId = isNew ? '' : (rule.resource_id || '');
    const scope = isNew ? 'general' : (rule.scope || 'general');
    const serviceTypeId = isNew ? '' : (rule.service_type_id || '');
    const serviceCategoryId = isNew ? '' : (rule.service_category_id || '');
    const serviceId = isNew ? '' : (rule.service_id || '');
    const dayOfWeek = isNew ? '' : (rule.day_of_week ?? '');
    const startTime = isNew ? '' : ((rule.start_time || '').substring(0, 5));
    const endTime = isNew ? '' : ((rule.end_time || '').substring(0, 5));
    const isActive = isNew ? true : (rule.is_active !== false);
    
    const cardCls = isActive ? 'rule-card' : 'rule-card inactive-rule';

    const resourceOptions = allResources.map(r => 
      `<option value="${escapeHtml(r.id)}"${r.id === resourceId ? ' selected' : ''}>${escapeHtml(r.name)}</option>`
    ).join('');

    const typeOptions = allServiceTypes.map(t => 
      `<option value="${escapeHtml(t.id)}"${t.id === serviceTypeId ? ' selected' : ''}>${escapeHtml(t.name)}</option>`
    ).join('');

    const categoryOptions = allServiceCategories.map(c => 
      `<option value="${escapeHtml(c.id)}"${c.id === serviceCategoryId ? ' selected' : ''}>${escapeHtml(c.name)}</option>`
    ).join('');

    const serviceOptions = allServices.map(s => 
      `<option value="${escapeHtml(s.id)}"${s.id === serviceId ? ' selected' : ''}>${escapeHtml(s.name)}</option>`
    ).join('');

    const dayOptions = DAYS_OF_WEEK.map(d => 
      `<option value="${d.value}"${d.value === dayOfWeek ? ' selected' : ''}>${escapeHtml(d.name)}</option>`
    ).join('');

    const showType = scope === 'type';
    const showCategory = scope === 'category';
    const showService = scope === 'service';

    return `
      <div class="${cardCls}" data-rule-id="${escapeHtml(ruleId)}">
        <div class="rule-grid">
          <div>
            <label class="${labelCls}">Resource</label>
            <select class="${inputCls}" data-field="resource_id" required>
              <option value="">Select…</option>
              ${resourceOptions}
            </select>
            <div class="text-xs text-red-600 mt-1 hidden" data-role="resource_id-error"></div>
          </div>

          <div>
            <label class="${labelCls}">Scope</label>
            <select class="${inputCls}" data-field="scope" onchange="window.handleScopeChange('${escapeHtml(ruleId)}')" required>
              <option value="general"${scope === 'general' ? ' selected' : ''}>General</option>
              <option value="type"${scope === 'type' ? ' selected' : ''}>Type</option>
              <option value="category"${scope === 'category' ? ' selected' : ''}>Category</option>
              <option value="service"${scope === 'service' ? ' selected' : ''}>Service</option>
            </select>
            <div class="text-xs text-red-600 mt-1 hidden" data-role="scope-error"></div>
          </div>

          <div data-role="type-selector" class="${showType ? '' : 'hidden'}">
            <label class="${labelCls}">Service Type</label>
            <select class="${inputCls}" data-field="service_type_id">
              <option value="">Select…</option>
              ${typeOptions}
            </select>
            <div class="text-xs text-red-600 mt-1 hidden" data-role="service_type_id-error"></div>
          </div>

          <div data-role="category-selector" class="${showCategory ? '' : 'hidden'}">
            <label class="${labelCls}">Category</label>
            <select class="${inputCls}" data-field="service_category_id">
              <option value="">Select…</option>
              ${categoryOptions}
            </select>
            <div class="text-xs text-red-600 mt-1 hidden" data-role="service_category_id-error"></div>
          </div>

          <div data-role="service-selector" class="${showService ? '' : 'hidden'}">
            <label class="${labelCls}">Service</label>
            <select class="${inputCls}" data-field="service_id">
              <option value="">Select…</option>
              ${serviceOptions}
            </select>
            <div class="text-xs text-red-600 mt-1 hidden" data-role="service_id-error"></div>
          </div>

          <div>
            <label class="${labelCls}">Day</label>
            <select class="${inputCls}" data-field="day_of_week" required>
              <option value="">Select…</option>
              ${dayOptions}
            </select>
            <div class="text-xs text-red-600 mt-1 hidden" data-role="day_of_week-error"></div>
          </div>

          <div>
            <label class="${labelCls}">Start Time</label>
            <input type="time" class="${inputCls}" data-field="start_time" value="${escapeHtml(startTime)}" required />
            <div class="text-xs text-red-600 mt-1 hidden" data-role="start_time-error"></div>
          </div>

          <div>
            <label class="${labelCls}">End Time</label>
            <input type="time" class="${inputCls}" data-field="end_time" value="${escapeHtml(endTime)}" required />
            <div class="text-xs text-red-600 mt-1 hidden" data-role="end_time-error"></div>
          </div>

          <div>
            <label class="${labelCls}">Active</label>
            <select class="${inputCls}" data-field="is_active">
              <option value="true"${isActive ? ' selected' : ''}>Yes</option>
              <option value="false"${!isActive ? ' selected' : ''}>No</option>
            </select>
          </div>
        </div>

        <div class="flex gap-2 mt-3">
          <button type="button" class="btn btn-primary text-sm px-4 py-2" data-role="save-btn" onclick="window.saveAvailabilityRule('${escapeHtml(ruleId)}')">
            Save
          </button>
          ${isNew ? 
            `<button type="button" class="btn btn-outline-blue text-sm px-4 py-2" onclick="window.cancelAddRule()">Cancel</button>` :
            `<button type="button" class="btn btn-outline-red text-sm px-4 py-2" onclick="window.deleteAvailabilityRule('${escapeHtml(ruleId)}')">Delete</button>`
          }
        </div>

        <div class="text-xs text-red-600 mt-2 hidden" data-role="form-error"></div>
      </div>
    `;
  }

  function renderRules() {
    const list = document.getElementById('adminAvailabilityRulesList');
    if (!list) return;

    // Sort by day, then start time
    const sorted = [...allAvailabilityRules].sort((a, b) => {
      if (a.day_of_week !== b.day_of_week) return a.day_of_week - b.day_of_week;
      if (a.start_time < b.start_time) return -1;
      if (a.start_time > b.start_time) return 1;
      return 0;
    });

    let html = sorted.map(rule => renderRuleCard(rule)).join('');
    
    if (isAddingNew) {
      html += renderRuleCard(null, true);
    }

    if (!html && !isAddingNew) {
      html = '<div class="text-gray-500 text-sm">No availability rules configured.</div>';
    }

    list.innerHTML = html;
  }

  window.handleScopeChange = function(ruleId) {
    const card = document.querySelector(`[data-rule-id="${ruleId}"]`);
    if (!card) return;

    const scopeSelect = card.querySelector('[data-field="scope"]');
    const typeSelector = card.querySelector('[data-role="type-selector"]');
    const categorySelector = card.querySelector('[data-role="category-selector"]');
    const serviceSelector = card.querySelector('[data-role="service-selector"]');
    const typeInput = card.querySelector('[data-field="service_type_id"]');
    const categoryInput = card.querySelector('[data-field="service_category_id"]');
    const serviceInput = card.querySelector('[data-field="service_id"]');

    const scope = scopeSelect.value;

    if (scope === 'general') {
      typeSelector.classList.add('hidden');
      categorySelector.classList.add('hidden');
      serviceSelector.classList.add('hidden');
      if (typeInput) typeInput.value = '';
      if (categoryInput) categoryInput.value = '';
      if (serviceInput) serviceInput.value = '';
    } else if (scope === 'type') {
      typeSelector.classList.remove('hidden');
      categorySelector.classList.add('hidden');
      serviceSelector.classList.add('hidden');
      if (categoryInput) categoryInput.value = '';
      if (serviceInput) serviceInput.value = '';
    } else if (scope === 'category') {
      typeSelector.classList.add('hidden');
      categorySelector.classList.remove('hidden');
      serviceSelector.classList.add('hidden');
      if (typeInput) typeInput.value = '';
      if (serviceInput) serviceInput.value = '';
    } else if (scope === 'service') {
      typeSelector.classList.add('hidden');
      categorySelector.classList.add('hidden');
      serviceSelector.classList.remove('hidden');
      if (typeInput) typeInput.value = '';
      if (categoryInput) categoryInput.value = '';
    }
  };

  async function loadData() {
    if (!window.supabaseClient) {
      setRulesMsg('Supabase client not ready.', 'text-red-600');
      return;
    }

    setRulesMsg('Loading…', 'text-gray-600');

    try {
      const [rulesRes, resourcesRes, typesRes, categoriesRes, servicesRes] = await Promise.all([
        window.supabaseClient.from('availability').select('*').order('day_of_week').order('start_time'),
        window.supabaseClient.from('resource').select('*').order('name'),
        window.supabaseClient.from('service_type').select('*').eq('is_active', true).order('sort_order').order('name'),
        window.supabaseClient.from('service_category').select('*').eq('is_active', true).order('name'),
        window.supabaseClient.from('service').select('*').eq('is_active', true).order('name')
      ]);

      if (rulesRes.error) throw rulesRes.error;
      if (resourcesRes.error) throw resourcesRes.error;
      if (typesRes.error) throw typesRes.error;
      if (categoriesRes.error) throw categoriesRes.error;
      if (servicesRes.error) throw servicesRes.error;

      allAvailabilityRules = rulesRes.data || [];
      allResources = resourcesRes.data || [];
      allServiceTypes = typesRes.data || [];
      allServiceCategories = categoriesRes.data || [];
      allServices = servicesRes.data || [];
      rulesLoaded = true;

      renderRules();
      setRulesMsg('', '');
    } catch (e) {
      console.error('[admin-availability-rules] load failed:', e);
      setRulesMsg('Failed to load availability rules. Please try again.', 'text-red-600');
      const list = document.getElementById('adminAvailabilityRulesList');
      if (list) list.innerHTML = '';
    }
  }

  window.addAvailabilityRule = function() {
    isAddingNew = true;
    renderRules();
    
    const newCard = document.querySelector('[data-rule-id="new"]');
    if (newCard) {
      newCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  };

  window.cancelAddRule = function() {
    isAddingNew = false;
    renderRules();
  };

  function clearCardErrors(card) {
    const errorEls = card.querySelectorAll('[data-role$="-error"]');
    errorEls.forEach(el => el.classList.add('hidden'));
  }

  function showFieldError(card, fieldName, message) {
    const errorEl = card.querySelector(`[data-role="${fieldName}-error"]`);
    if (errorEl) {
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }
  }

  function showFormError(card, message) {
    const errorEl = card.querySelector('[data-role="form-error"]');
    if (errorEl) {
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }
  }

  function getFieldValue(card, fieldName) {
    const input = card.querySelector(`[data-field="${fieldName}"]`);
    return input ? input.value.trim() : '';
  }

  function validateRule(card) {
    clearCardErrors(card);
    let isValid = true;
    let firstErrorField = null;

    const resourceId = getFieldValue(card, 'resource_id');
    const scope = getFieldValue(card, 'scope');
    const typeId = getFieldValue(card, 'service_type_id');
    const categoryId = getFieldValue(card, 'service_category_id');
    const serviceId = getFieldValue(card, 'service_id');
    const dayOfWeek = getFieldValue(card, 'day_of_week');
    const startTime = getFieldValue(card, 'start_time');
    const endTime = getFieldValue(card, 'end_time');

    if (!resourceId) {
      showFieldError(card, 'resource_id', 'Resource is required');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="resource_id"]');
      isValid = false;
    }

    if (!scope) {
      showFieldError(card, 'scope', 'Scope is required');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="scope"]');
      isValid = false;
    }

    if (scope === 'type' && !typeId) {
      showFieldError(card, 'service_type_id', 'Service Type is required for Type scope');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="service_type_id"]');
      isValid = false;
    }

    if (scope === 'category' && !categoryId) {
      showFieldError(card, 'service_category_id', 'Category is required for Category scope');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="service_category_id"]');
      isValid = false;
    }

    if (scope === 'service' && !serviceId) {
      showFieldError(card, 'service_id', 'Service is required for Service scope');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="service_id"]');
      isValid = false;
    }

    if (!dayOfWeek && dayOfWeek !== '0') {
      showFieldError(card, 'day_of_week', 'Day is required');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="day_of_week"]');
      isValid = false;
    }

    if (!startTime) {
      showFieldError(card, 'start_time', 'Start time is required');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="start_time"]');
      isValid = false;
    }

    if (!endTime) {
      showFieldError(card, 'end_time', 'End time is required');
      if (!firstErrorField) firstErrorField = card.querySelector('[data-field="end_time"]');
      isValid = false;
    }

    if (startTime && endTime && startTime >= endTime) {
      showFormError(card, 'End time must be later than start time.');
      isValid = false;
    }

    if (firstErrorField) {
      firstErrorField.focus();
    }

    return isValid;
  }

  async function checkBusinessHours(dayOfWeek, startTime, endTime) {
    const dayNumber = parseInt(dayOfWeek, 10);

    const { data, error } = await window.supabaseClient
        .from('business_hours')
        .select('*')
        .eq('day_of_week', dayNumber)
        .order('start_time', { ascending: true });

    if (error) {
        console.error('[admin-availability-rules] business hours load failed:', error);
        return {
        valid: false,
        error: 'Business hours could not be loaded. Please try again.'
        };
    }

    const businessHours = Array.isArray(data) ? data : [];

    if (businessHours.length === 0) {
        const dayName = getDayName(dayNumber);
        return {
        valid: false,
        error: `Business is closed on ${dayName}. Cannot add availability rule.`
        };
    }

    const dbStartTime = formatTimeForDb(startTime);
    const dbEndTime = formatTimeForDb(endTime);

    const fitsInPeriod = businessHours.some(bh =>
        dbStartTime >= bh.start_time &&
        dbEndTime <= bh.end_time
    );

    if (!fitsInPeriod) {
        const dayName = getDayName(dayNumber);
        return {
        valid: false,
        error: `Availability period must fit completely within configured business hours for ${dayName}.`
        };
    }

    return { valid: true };
  }

  window.saveAvailabilityRule = async function(ruleId) {
    if (!window.supabaseClient) {
      setRulesMsg('Supabase client not ready.', 'text-red-600');
      return;
    }

    const card = document.querySelector(`[data-rule-id="${ruleId}"]`);
    if (!card) return;

    if (!validateRule(card)) return;

    const saveBtn = card.querySelector('[data-role="save-btn"]');
    const originalBtnText = saveBtn ? saveBtn.textContent : '';

    const resourceId = getFieldValue(card, 'resource_id');
    const scope = getFieldValue(card, 'scope');
    const typeId = getFieldValue(card, 'service_type_id') || null;
    const categoryId = getFieldValue(card, 'service_category_id') || null;
    const serviceId = getFieldValue(card, 'service_id') || null;
    const dayOfWeek = parseInt(getFieldValue(card, 'day_of_week'), 10);
    const startTime = getFieldValue(card, 'start_time');
    const endTime = getFieldValue(card, 'end_time');
    const isActive = getFieldValue(card, 'is_active') === 'true';

    // Check business hours
    const bhCheck = await checkBusinessHours(dayOfWeek, startTime, endTime);
    if (!bhCheck.valid) {
      showFormError(card, bhCheck.error);
      return;
    }

    const payload = {
      resource_id: resourceId,
      scope: scope,
      service_type_id: scope === 'type' ? typeId : null,
      service_category_id: scope === 'category' ? categoryId : null,
      service_id: scope === 'service' ? serviceId : null,
      day_of_week: dayOfWeek,
      start_time: formatTimeForDb(startTime),
      end_time: formatTimeForDb(endTime),
      is_active: isActive
    };

    try {
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
      }

      if (ruleId === 'new') {
        const { data, error } = await window.supabaseClient
          .from('availability')
          .insert([payload])
          .select()
          .single();

        if (error) throw error;

        allAvailabilityRules.push(data);
        isAddingNew = false;
      } else {
        const { error } = await window.supabaseClient
          .from('availability')
          .update(payload)
          .eq('id', ruleId);

        if (error) throw error;

        const idx = allAvailabilityRules.findIndex(r => r.id === ruleId);
        if (idx !== -1) {
          allAvailabilityRules[idx] = { ...allAvailabilityRules[idx], ...payload };
        }
      }

      if (saveBtn) {
        saveBtn.textContent = 'Saved';
      }

      setTimeout(() => {
        renderRules();
        setRulesMsg('', '');
      }, 1500);

    } catch (e) {
      console.error('[admin-availability-rules] save failed:', e);
      showFormError(card, 'Failed to save rule. Please try again.');
      if (saveBtn) {
        saveBtn.textContent = originalBtnText;
        saveBtn.disabled = false;
      }
    }
  };

  async function performDeleteRule(ruleId) {
    try {
      const { error } = await window.supabaseClient
        .from('availability')
        .delete()
        .eq('id', ruleId);

      if (error) throw error;

      allAvailabilityRules = allAvailabilityRules.filter(r => r.id !== ruleId);
      renderRules();
      setRulesMsg('', '');
    } catch (e) {
      console.error('[admin-availability-rules] delete failed:', e);
      setRulesMsg('Failed to delete rule. Please try again.', 'text-red-600');
    }
  }

  window.deleteAvailabilityRule = function(ruleId) {
    if (!ruleId || ruleId === 'new') return;

    const rule = allAvailabilityRules.find(r => r.id === ruleId);
    if (!rule) return;

    const resourceName = getResourceName(rule.resource_id);
    const dayName = getDayName(rule.day_of_week);
    const scopeLabel = rule.scope === 'general' ? 'General' : 
                      rule.scope === 'type' ? getTypeName(rule.service_type_id) :
                      rule.scope === 'category' ? getCategoryName(rule.service_category_id) :
                      getServiceName(rule.service_id);

    const confirmMsg = `Are you sure you want to delete this availability rule?\n\nResource: ${resourceName}\nScope: ${scopeLabel}\nDay: ${dayName}\n\nThis action cannot be undone.`;

    if (window.Modal && typeof window.Modal.confirm === 'function') {
      window.Modal.confirm(
        confirmMsg,
        () => performDeleteRule(ruleId),
        null,
        'Delete Availability Rule',
        { confirmText: 'Yes, Delete', cancelText: 'Cancel' }
      );
    } else {
      const ok = window.confirm(confirmMsg);
      if (ok) {
        performDeleteRule(ruleId);
      }
    }
  };

  function initAvailabilityRules() {
    const section = document.getElementById('section-availability-rules');
    if (!section) return;

    if (section.dataset.rulesInit === '1') return;
    section.dataset.rulesInit = '1';

    const addBtn = document.getElementById('addAvailabilityRuleBtn');
    if (addBtn) {
      addBtn.addEventListener('click', window.addAvailabilityRule);
    }

    const refreshBtn = document.getElementById('availabilityRulesRefreshBtn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', loadData);
    }

    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
          const isVisible = !section.classList.contains('hidden');
          if (isVisible && !rulesLoaded) {
            loadData();
          }
        }
      });
    });

    observer.observe(section, { attributes: true });

    if (!section.classList.contains('hidden')) {
      loadData();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAvailabilityRules);
  } else {
    initAvailabilityRules();
  }
})();
</script>
